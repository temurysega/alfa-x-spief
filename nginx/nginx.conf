worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 30s;
  server_tokens off;

  access_log /var/log/nginx/access.log combined buffer=64k flush=5s;

  gzip on;
  gzip_min_length 512;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Токен участника из адреса снимка: /state/<токен>.json
  map $uri $state_token {
    ~^/state/(?<t>[A-Za-z0-9_-]+)\.json$ $t;
    default "";
  }

  # Лимиты по IP мягкие: весь класс может сидеть за одним школьным Wi-Fi.
  limit_req_zone $binary_remote_addr zone=ip_api:10m   rate=50r/s;
  limit_req_zone $binary_remote_addr zone=ip_join:10m  rate=5r/s;
  limit_req_zone $binary_remote_addr zone=ip_admin:10m rate=10r/m;
  limit_req_zone $state_token        zone=token:10m    rate=2r/s;
  limit_req_status 429;

  upstream app {
    server server:3000;
    keepalive 32;
  }

  server {
    listen 80;
    root /srv/client;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;

    # Серверное время для синхронизации часов клиента. Отвечает сам nginx.
    location = /api/time {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 200 '{"t":$msec}';
    }

    # Снимки участников — обычные файлы с диска, логику игры не нагружают.
    location ~ "^/state/[A-Za-z0-9_-]{20,}\.json$" {
      root /data;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      limit_req zone=token burst=10 nodelay;
    }
    location /state/ {
      return 404;
    }

    # Картинки вопросов. Отдаются с диска, а не через прокси, поэтому proxy_cache_lock не нужен.
    location /img/ {
      root /data;
      expires 1h;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location = /api/answer {
      limit_req zone=ip_api burst=400 nodelay;
      proxy_pass http://app;
    }
    location = /api/join {
      limit_req zone=ip_join burst=300 nodelay;
      proxy_pass http://app;
    }
    location = /api/login {
      limit_req zone=ip_join burst=300 nodelay;
      proxy_pass http://app;
    }
    location = /api/admin/login {
      limit_req zone=ip_admin burst=5 nodelay;
      proxy_pass http://app;
    }
    location /api/admin/ {
      client_max_body_size 6m;
      proxy_pass http://app;
    }
    # Всё остальное в /api закрыто.
    location /api/ {
      return 404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
